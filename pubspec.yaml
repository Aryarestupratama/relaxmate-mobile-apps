name: relaxmate
description: RelaxMate - pendamping AI untuk mahasiswa (aplikasi mobile RelaxBoss).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Versi `any` hanya untuk setup awal. Setelah `flutter pub get`, jalankan
# `dart pub upgrade --tighten` agar batas versi tertulis dan dikunci di pubspec.lock.
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  lucide_icons_flutter: ^4.0.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Folder aset lain (audio/clips, crisis, texts) didaftarkan pada task yang mengisinya.
  assets:
    - assets/images/mascot/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
